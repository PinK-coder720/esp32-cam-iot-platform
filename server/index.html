<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-CAM 照片墙</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .upload-box { text-align: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin-left: auto; margin-right: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .card p { font-size: 12px; color: #666; word-break: break-all; margin: 5px 0 0 0; }
        #status { text-align: center; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>ESP32-CAM 照片墙</h1>
    
    <div class="upload-box">
        <h3>手动上传照片</h3>
        <input type="file" id="fileInput" accept="image/jpeg">
        <button onclick="uploadFile()">上传</button>
        <p id="uploadStatus"></p>
    </div>

    <div id="status">正在加载...</div>
    <div class="gallery" id="gallery"></div>

    <script>
        // 上传功能
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const uploadStatus = document.getElementById('uploadStatus');
            const file = fileInput.files[0];

            if (!file) {
                uploadStatus.innerText = "请先选择一张图片！";
                uploadStatus.style.color = "red";
                return;
            }

            uploadStatus.innerText = "正在上传...";
            uploadStatus.style.color = "blue";

            try {
                // 直接将文件对象作为请求体发送，格式设为 image/jpeg
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'image/jpeg' },
                    body: file
                });
                const data = await response.json();

                if (data.ok) {
                    uploadStatus.innerText = "上传成功！";
                    uploadStatus.style.color = "green";
                    // 清空文件选择
                    fileInput.value = "";
                    // 重新加载照片墙
                    loadPhotos();
                } else {
                    uploadStatus.innerText = "上传失败！";
                    uploadStatus.style.color = "red";
                }
            } catch (error) {
                uploadStatus.innerText = "网络错误：" + error.message;
                uploadStatus.style.color = "red";
            }
        }

        // 加载照片墙功能
        async function loadPhotos() {
            const statusEl = document.getElementById("status");
            const galleryEl = document.getElementById("gallery");
            
            // 每次刷新先清空旧内容
            galleryEl.innerHTML = ""; 

            try {
                const response = await fetch("/api/photos");
                const data = await response.json();
                if (!data.ok) throw new Error("接口返回失败");
                
                const photos = data.photos;
                if (photos.length === 0) {
                    statusEl.innerText = "还没有照片！";
                    return;
                }
                
                statusEl.innerText = `共找到 ${photos.length} 张照片`;
                
                photos.forEach(filename => {
                    const card = document.createElement("div");
                    card.className = "card";
                    const img = document.createElement("img");
                    img.src = `/images/${filename}`;
                    img.onclick = () => window.open(img.src, "_blank");
                    const p = document.createElement("p");
                    p.innerText = filename;
                    card.appendChild(img);
                    card.appendChild(p);
                    galleryEl.appendChild(card);
                });
            } catch (error) {
                statusEl.innerText = "加载失败：" + error.message;
                statusEl.style.color = "red";
            }
        }
        
        // 页面启动时加载一次
        loadPhotos();
    </script>
</body>
</html>

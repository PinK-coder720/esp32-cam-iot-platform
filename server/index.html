<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32-CAM - Cloud Gallery</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --accent: #0071e3;
            --radius: 20px;
            /* 苹果标志性的平滑弹簧曲线 */
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ✨ 特效 1：背景极光呼吸光晕 */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-1, .glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: breathe 10s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 600px;
            height: 600px;
            background: rgba(0, 113, 227, 0.15); /* 浅苹果蓝 */
            top: -200px;
            left: -100px;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: rgba(255, 149, 0, 0.1); /* 浅苹果橙 */
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes breathe {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(50px, 50px); }
        }

        /* 顶部导航 */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            height: 52px;
            background: rgba(245, 245, 247, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            font-size: 14px;
        }

        .logo {
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34c759;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(52, 199, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }

        /* ✨ 特效 2：首屏元素平滑上浮入场 */
        .hero {
            text-align: center;
            padding: 80px 20px 40px;
            animation: slideUp 1s var(--spring) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #1d1d1f 0%, #434344 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 24px;
            color: var(--text-sub);
            letter-spacing: 0.009em;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 80px;
            animation: slideUp 1s var(--spring) 0.2s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 上传卡片 */
        .upload-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.4s var(--spring);
            margin-bottom: 60px;
            border: 2px dashed rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .upload-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 113, 227, 0.4);
            background: #ffffff;
        }

        /* 按下时的物理回弹感 */
        .upload-card:active {
            transform: translateY(0) scale(0.98);
            transition: all 0.1s;
        }

        .upload-card.dragover {
            border-color: var(--accent);
            background: rgba(0, 113, 227, 0.05);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 20px;
            display: inline-block;
            transition: all 0.5s var(--spring);
        }

        .upload-card:hover .upload-icon {
            transform: translateY(-8px) scale(1.1);
        }

        .upload-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-desc {
            font-size: 14px;
            color: var(--text-sub);
        }

        #uploadStatus {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            min-height: 21px;
            transition: color 0.3s;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .divider::before { margin-right: 20px; }
        .divider::after { margin-left: 20px; }

        /* 照片墙 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* ✨ 特效 3：卡片 3D 悬浮与光影 */
        .photo-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.5s var(--spring);
            cursor: pointer;
            position: relative;
            /* 入场动画（通过 JS 动态设置延迟） */
            opacity: 0;
            transform: translateY(40px) scale(0.9);
            animation: popIn 0.8s var(--spring) forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .photo-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        .photo-card:active {
            transform: translateY(-2px) scale(0.98);
            transition: all 0.1s;
        }

        .photo-img-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: var(--bg-color);
            position: relative;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s var(--smooth);
            /* 图片载入淡入 */
            opacity: 0;
        }

        .photo-card img.loaded {
            animation: imgFadeIn 0.6s ease forwards;
        }

        @keyframes imgFadeIn {
            to { opacity: 1; }
        }

        .photo-card:hover img {
            transform: scale(1.08);
        }

        .photo-meta {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            background: var(--card-bg);
            position: relative;
            z-index: 2;
        }

        .photo-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
            color: var(--text-main);
        }

        .photo-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* 骨架屏 */
        .skeleton-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        
        .skeleton-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: linear-gradient(90deg, #f5f5f7 25%, #e8e8ed 50%, #f5f5f7 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        .skeleton-text {
            height: 54px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ✨ 特效 4：大图弹性缩放与毛玻璃 */
        .lightbox {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--smooth);
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            object-fit: contain;
            /* 弹性缩放起点 */
            transform: scale(0.8) translateY(20px);
            transition: transform 0.5s var(--spring);
        }

        .lightbox.active img {
            transform: scale(1) translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s var(--spring);
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.12);
            transform: rotate(90deg) scale(1.1);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 36px; }
            .hero p { font-size: 18px; }
            .hero { padding: 50px 20px 30px; }
            .upload-card { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <!-- 动态极光背景 -->
    <div class="ambient-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <nav>
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
            </svg>
            ESP32-CAM
        </div>
        <div class="status">
            <div class="status-dot"></div>
            云端已连接
        </div>
    </nav>

    <div class="hero">
        <h1>云端影像中枢</h1>
        <p>安全、极速、永久的照片图库。</p>
    </div>

    <div class="container">
        <!-- 上传区 -->
        <div class="upload-card" id="dropZone">
            <div class="upload-icon">↓</div>
            <div class="upload-title">点击或拖拽照片至此</div>
            <div class="upload-desc">支持 JPEG 格式，单张最大 2MB</div>
            <div id="uploadStatus"></div>
            <input type="file" id="fileInput" accept="image/jpeg" style="display: none;">
        </div>

        <div class="divider">图库记录</div>
        
        <!-- 照片墙 -->
        <div class="gallery" id="gallery">
            <!-- JS 动态注入 -->
        </div>
    </div>

    <!-- 大图预览 -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img id="lightboxImg" src="" alt="Preview">
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');

        // 拖拽和点击上传
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) uploadFile(fileInput.files[0]);
        });

        // 上传逻辑
        async function uploadFile(file) {
            if (!file.type.includes('jpeg') && !file.type.includes('jpg')) {
                uploadStatus.style.color = '#ff3b30';
                uploadStatus.innerText = "仅支持 JPG / JPEG 格式";
                return;
            }

            uploadStatus.style.color = 'var(--text-sub)';
            uploadStatus.innerText = "正在上传...";

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'image/jpeg' },
                    body: file
                });
                const data = await response.json();

                if (data.ok) {
                    uploadStatus.style.color = '#34c759';
                    uploadStatus.innerText = "上传成功，已同步至云端";
                    fileInput.value = "";
                    loadPhotos(); // 重新加载
                } else {
                    uploadStatus.style.color = '#ff3b30';
                    uploadStatus.innerText = "上传失败：" + (data.error || "未知错误");
                }
            } catch (error) {
                uploadStatus.style.color = '#ff3b30';
                uploadStatus.innerText = "网络异常，请稍后重试";
            }
        }

        // 加载列表
        async function loadPhotos() {
            gallery.innerHTML = `
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
            `;

            try {
                const response = await fetch("/api/photos");
                const data = await response.json();
                
                if (!data.ok) throw new Error("接口异常");
                
                const photos = data.photos;
                gallery.innerHTML = '';
                
                if (photos.length === 0) {
                    gallery.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">暂无照片，请上传第一张图。</div>';
                    return;
                }
                
                photos.forEach((filename, index) => {
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    // ✨ 动态设置延迟，实现瀑布流依次弹出的效果
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    card.onclick = () => {
                        lightboxImg.src = `/images/${filename}`;
                        lightbox.classList.add('active');
                    };

                    const imgSrc = `/images/${filename}`;
                    
                    card.innerHTML = `
                        <div class="photo-img-wrapper">
                            <img src="${imgSrc}" loading="lazy" alt="照片">
                        </div>
                        <div class="photo-meta">
                            <span class="photo-name">${filename}</span>
                            <span class="photo-badge">JPEG</span>
                        </div>
                    `;
                    
                    // ✨ 图片加载完成后的淡入特效
                    const imgEl = card.querySelector('img');
                    imgEl.onload = () => imgEl.classList.add('loaded');

                    gallery.appendChild(card);
                });
            } catch (error) {
                gallery.innerHTML = '';
                gallery.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff3b30;">加载失败，请刷新重试。</div>`;
            }
        }

        // 大图控制
        closeBtn.onclick = () => {
            lightbox.classList.remove('active');
            setTimeout(() => lightboxImg.src = "", 300);
        };
        lightbox.onclick = (e) => {
            if (e.target === lightbox) closeBtn.onclick();
        };

        // 初始化
        loadPhotos();
    </script>
</body>
</html>

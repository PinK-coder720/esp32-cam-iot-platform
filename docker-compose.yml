version: '3.8'

services:

  server:
      build: ./server
      container_name: cam-server
      restart: unless-stopped
      volumes:
        - ./server/uploads:/app/uploads
      expose:
        - "5000"

  nginx:
      image: nginx:alpine
      container_name: cam-nginx
      restart: unless-stopped
      ports:
        - "80:80"
      volumes:
        - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - server